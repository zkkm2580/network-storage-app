name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 ships a working Android SDK + sdkmanager combination.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          echo "--- preinstalled platforms ---"
          ls "$SDK/platforms" 2>/dev/null || true

          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager=$SDKMANAGER"

          if [ -x "$SDKMANAGER" ] || command -v sdkmanager >/dev/null 2>&1; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          else
            echo "sdkmanager unavailable, relying on preinstalled SDK"
          fi

          echo "--- final platforms ---"
          ls "$SDK/platforms" || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: network-storage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk network-storage-debug.apk

      - name: Publish Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NetworkStorage 最新版（debug APK）
          body: |
            由 GitHub Actions 自动构建，提交 `${{ github.sha }}`。
            每次推送到 main 都会更新这里的 APK，直链固定、免登录、不会过期。
            直链下载：https://github.com/zkkm2580/network-storage-app/releases/download/latest/network-storage-debug.apk
          files: network-storage-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
